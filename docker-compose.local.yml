services:
  postgres:
    image: postgres:16-alpine
    container_name: poolc-postgres
    environment:
      POSTGRES_DB: poolc
      POSTGRES_USER: poolc
      POSTGRES_PASSWORD: poolc_dev_password
    ports:
      - "5432:5432"
    volumes:
      - poolc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poolc -d poolc"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: poolc-minio:local
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
    container_name: poolc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${GAME_BUILD_S3_ACCESS_KEY:-poolc}
      MINIO_ROOT_PASSWORD: ${GAME_BUILD_S3_SECRET_KEY:-poolc_dev_password}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - poolc-minio-data:/data

  api:
    image: eclipse-temurin:11-jdk
    container_name: poolc-be-dev
    working_dir: /workspace
    command: ./gradlew bootRun
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      PROJECT_NAME_HERE_SECRET_KEY: local_dev_secret_key_for_poolc
      EXPIRE_LENGTH_IN_MILLISECONDS: "3600000"
      FILE_DIR: /workspace/local-files/
      DB_HOST: postgres:5432
      DB_NAME: poolc
      DB_USER_NAME: poolc
      DB_PASSWORD: poolc_dev_password
      EMAIL_ADDRESS: local@example.com
      EMAIL_PASSWORD: dummy
      KAKAO_BOOK_REST_API_KEY: ${KAKAO_BOOK_REST_API_KEY:-dummy}
      KUBERNETES_API_KEY: local-dev
      AWS_REGION: us-east-1
      GAME_BUILD_S3_BUCKET: poolc-dev
      GAME_BUILD_PUBLIC_BASE_URL: http://localhost:9000/poolc-dev
      GAME_BUILD_S3_PRESIGN_ENDPOINT: http://localhost:9000
      GAME_BUILD_S3_ADMIN_ENDPOINT: http://minio:9000
      GAME_BUILD_S3_ACCESS_KEY: ${GAME_BUILD_S3_ACCESS_KEY:-poolc}
      GAME_BUILD_S3_SECRET_KEY: ${GAME_BUILD_S3_SECRET_KEY:-poolc_dev_password}
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - poolc-gradle-cache:/root/.gradle

  frontend:
    image: node:20-alpine
    container_name: poolc-fe-dev
    working_dir: /workspace
    command: sh -c "corepack enable && yarn install --immutable && yarn workspace @dialga/poolc.org start --host 0.0.0.0"
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://api:8080
      VITE_OPEN: "false"
    ports:
      - "3000:3000"
    volumes:
      - ../PoolC-FE:/workspace
      - poolc-fe-node-modules:/workspace/node_modules

volumes:
  poolc-postgres-data:
  poolc-minio-data:
  poolc-gradle-cache:
  poolc-fe-node-modules:
